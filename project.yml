# XcodeGen specification — generate the Xcode project with `make project`.
# https://github.com/yonaskolb/XcodeGen
name: Waystage
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Package modules compile in Swift 6 mode; the thin app shell keeps Swift 5 mode with
    # complete concurrency checking reported as warnings (see docs/ARCHITECTURE.md, ADR-004).
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  WaystageKit:
    path: Packages/WaystageKit
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0
targets:
  Waystage:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Waystage
        PRODUCT_BUNDLE_IDENTIFIER: $(WAYSTAGE_BUNDLE_ID)
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(WAYSTAGE_TEAM_ID)
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: WaystageKit
        product: TripModels
      - package: WaystageKit
        product: TripPlanner
      - package: WaystageKit
        product: TripServices
      - package: WaystageKit
        product: TripNavigation
      - package: WaystageKit
        product: TripPersistence
      - package: WaystageKit
        product: TripFeatures
      - package: WaystageKit
        product: TripSandbox
      - package: GoogleMaps
        product: GoogleMaps
  WaystageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WAYSTAGE_BUNDLE_ID).tests
    dependencies:
      - target: Waystage
  WaystageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
      # Identifiers and launch arguments are shared with the app so they never drift.
      - path: App/Sources/Support/AccessibilityID.swift
      - path: App/Sources/Support/LaunchArgument.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WAYSTAGE_BUNDLE_ID).uitests
    dependencies:
      - target: Waystage
schemes:
  Waystage:
    build:
      targets:
        Waystage: all
        WaystageTests: [test]
        WaystageUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Waystage
      targets:
        - name: WaystageTests
          parallelizable: true
          randomExecutionOrder: true
        - name: WaystageUITests
    archive:
      config: Release

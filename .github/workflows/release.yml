name: Release
# Shows the lane in the list of runs, e.g. "Release: beta".
run-name: "Release: ${{ inputs.lane }}${{ inputs.create_certificates && ' (create certificates)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = build and send to TestFlight; release = fill the App Store page (listing, review notes, age rating; not screenshots); metadata = listing text only"
        type: choice
        options: [beta, release, metadata]
        default: beta
      create_certificates:
        description: "First run only: let fastlane match create the signing certificate and profile"
        type: boolean
        default: false
      refresh_profile:
        description: "Make a new provisioning profile (once, after turning on CarPlay Navigation for the App ID)"
        type: boolean
        default: false
      run_tests:
        description: "Run the iOS test suite before building"
        type: boolean
        default: true

jobs:
  release:
    # Xcode 27 (iOS 27 SDK): from April 2027 the App Store only takes apps built with it
    # (ITMS-90725). GitHub ships one Xcode major version per macOS image; Xcode 27 is on this one.
    runs-on: xcode-27
    environment: app-store
    timeout-minutes: 120
    env:
      # From the Variables tab, or the Secrets tab if they were saved there. Names from before the
      # rename used the CADENCE_ prefix.
      WAYSTAGE_BUNDLE_ID: ${{ vars.WAYSTAGE_BUNDLE_ID || secrets.WAYSTAGE_BUNDLE_ID || vars.CADENCE_BUNDLE_ID }}
      WAYSTAGE_TEAM_ID: ${{ vars.WAYSTAGE_TEAM_ID || secrets.WAYSTAGE_TEAM_ID || vars.CADENCE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Hand the key and IDs to the build
        # The build reads them from Config/Secrets.xcconfig, which exists only on this temporary
        # machine: it is written here from the repository's secrets and variables, is git-ignored,
        # is never uploaded, and is deleted with the machine when the job ends.
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          WAYSTAGE_GATEWAY_URL: ${{ secrets.WAYSTAGE_GATEWAY_URL }}
          WAYSTAGE_GATEWAY_TOKEN: ${{ secrets.WAYSTAGE_GATEWAY_TOKEN }}
          # Named in Google's navigation terms dialog (optional; defaults to "Waystage").
          WAYSTAGE_COMPANY_NAME: ${{ vars.WAYSTAGE_COMPANY_NAME }}
        run: |
          setting() { [ -n "$2" ] && printf '%s = %s\n' "$1" "$2"; return 0; }
          {
            setting WAYSTAGE_BUNDLE_ID "$WAYSTAGE_BUNDLE_ID"
            setting WAYSTAGE_TEAM_ID "$WAYSTAGE_TEAM_ID"
            setting GOOGLE_MAPS_API_KEY "$GOOGLE_MAPS_API_KEY"
            # xcconfig treats "//" as the start of a comment; "$()" keeps the URL whole.
            setting WAYSTAGE_GATEWAY_URL "$(printf '%s' "$WAYSTAGE_GATEWAY_URL" | sed 's#//#/$()/#g')"
            setting WAYSTAGE_GATEWAY_TOKEN "$WAYSTAGE_GATEWAY_TOKEN"
            setting WAYSTAGE_COMPANY_NAME "$WAYSTAGE_COMPANY_NAME"
          } > Config/Secrets.xcconfig
          # Which settings arrived (names only, never values).
          for name in WAYSTAGE_BUNDLE_ID WAYSTAGE_TEAM_ID GOOGLE_MAPS_API_KEY WAYSTAGE_GATEWAY_URL WAYSTAGE_GATEWAY_TOKEN WAYSTAGE_COMPANY_NAME; do
            if [ -n "${!name}" ]; then echo "set:     $name"; else echo "not set: $name"; fi
          done
      - name: Test before shipping
        if: ${{ inputs.run_tests }}
        run: scripts/test-all.sh ios
      - name: fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_READONLY: ${{ inputs.create_certificates && 'false' || 'true' }}
          MATCH_FORCE: ${{ inputs.refresh_profile && 'true' || 'false' }}
        run: bundle exec fastlane ${{ inputs.lane }}

name: Release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "fastlane lane to run"
        type: choice
        options: [beta, release, metadata]
        default: beta
      create_certificates:
        description: "First run only: let fastlane match create the signing certificate and profile"
        type: boolean
        default: false
      run_tests:
        description: "Run the iOS test suite before building"
        type: boolean
        default: true

jobs:
  release:
    runs-on: macos-15
    environment: app-store
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write build secrets
        env:
          SECRETS_XCCONFIG: ${{ secrets.SECRETS_XCCONFIG }}
        run: printf '%s\n' "$SECRETS_XCCONFIG" > Config/Secrets.xcconfig
      - name: Test before shipping
        if: ${{ inputs.run_tests }}
        run: scripts/test-all.sh ios
      - name: fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # Repository variables made before the rename used the CADENCE_ prefix.
          WAYSTAGE_BUNDLE_ID: ${{ vars.WAYSTAGE_BUNDLE_ID || vars.CADENCE_BUNDLE_ID }}
          WAYSTAGE_TEAM_ID: ${{ vars.WAYSTAGE_TEAM_ID || vars.CADENCE_TEAM_ID }}
          MATCH_READONLY: ${{ inputs.create_certificates && 'false' || 'true' }}
        run: bundle exec fastlane ${{ inputs.lane }}
